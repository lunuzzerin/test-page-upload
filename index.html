<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./frontend/assets/css/styles.css" />
    <link rel="shortcut icon" href="./frontend/assets/favicon.ico" type="image/x-icon" />
    <title>Index | César Trujillo</title>
</head>

<body class="bg-gradient-kame">
    <div class="container">
        <div class="d-flex justify-content-center align-items-center flex-column mb-3 vh-100 gap-2">
            <div class="card">
                <div class="card-header" id="greeting">Bienvenido</div>

                <div class="card-body bg-gradient-saiyan">
                    <div class="d-flex justify-content-between align-items-center gap-1">
                        <a href="./frontend/pages/blog.html"
                            class="text-decoration-none text-dark fw-bold fs-6 btn btn-primary w-100 mt-2 p-2 rounded-5">
                            <i class="bi bi-substack me-2"></i>Blog
                        </a>

                        <a href="./frontend/pages/greeting.html"
                            class="text-decoration-none text-dark fs-6 btn btn-secondary w-100 mt-2 p-2 rounded-5">
                            <i class="bi bi-hand-thumbs-up-fill me-2"></i>Saludo
                        </a>

                        <a href="./frontend/pages/calculator.html"
                            class="text-decoration-none text-dark fs-6 btn btn-secondary w-100 mt-2 p-2 rounded-5">
                            <i class="bi bi-calculator me-2"></i>Calculadora
                        </a>

                        <button id="greetingApi"
                            class="text-decoration-none text-dark fs-6 btn btn-secondary w-100 mt-2 p-2 rounded-5">
                            <i class="bi bi-send me-2"></i>FastAPI
                        </button>

                        <a href="./frontend/pages/company/company.html" class="text-decoration-none text-dark fs-6 btn btn-secondary w-100 mt-2 p-2 rounded-5">
                            <i class="bi bi-building me-2"></i>Empresa
                        </a>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header" id="titleToColor">Cambia Color</div>

                <div class="card-body bg-gradient-saiyan">
                    <div class="d-flex justify-content-between align-items-center gap-1" id="section-button-change">
                        <button
                            class="button-text-change text-decoration-none text-dark fs-6 btn btn-primary w-100 mt-2 p-2 rounded-5">
                            Red
                        </button>

                        <button
                            class="button-text-change text-decoration-none text-dark fs-6 btn btn-secondary w-100 mt-2 p-2 rounded-5">
                            Blue
                        </button>

                        <button
                            class="button-text-change text-decoration-none text-dark fs-6 btn btn-warning w-100 mt-2 p-2 rounded-5">
                            Yellow
                        </button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header" id="resultToOperation">Resultado</div>

                <div class="card-body bg-gradient-saiyan">
                    <div class="d-flex justify-content-between align-items-center gap-1" id="section-button-operation">
                        <button
                            class="button-text-change text-decoration-none text-dark fs-6 btn btn-primary w-100 mt-2 p-2 rounded-5">
                            5
                        </button>

                        <button
                            class="button-text-change text-decoration-none text-dark fs-6 btn btn-secondary w-100 mt-2 p-2 rounded-5">
                            10
                        </button>

                        <button
                            class="button-text-change text-decoration-none text-dark fs-6 btn btn-warning w-100 mt-2 p-2 rounded-5">
                            15
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="dbz-footer mt-5">
        © 2025 Capsule Corp — Tema Dragon Ball Z
    </footer>

    <script type="module" src="./frontend/assets/js/base.js"></script>
